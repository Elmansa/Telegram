name: Download Gradle Cache as Artifact

on:
  workflow_dispatch:  # فقط با دستور手动 اجرا می‌شود

jobs:
  build-and-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build project (download all dependencies)
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatDebug --no-daemon
          # در صورت نیاز، می‌توانید از task دیگری مثل dependencies استفاده کنید
          # ./gradlew dependencies --no-daemon

      - name: Compress Gradle cache
        run: |
          tar -czf gradle-cache.tar.gz -C ~ .gradle
          # این دستور کل پوشه‌ی ~/.gradle را فشرده می‌کند

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gradle-cache
          path: gradle-cache.tar.gz
          retention-days: 7  # ۷ روز نگهداری شود
